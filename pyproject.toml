[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "datalite-rsi"
version = "0.1.0"
description = "Data-centric recursive self-improvement: an incumbent/challenger loop that evolves data-processing pipelines over a fixed corpus."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["rsi", "self-improvement", "data-centric", "llm", "pipeline", "agents"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Enough to import rsi.framework and run a generated pipeline. Transport and
# model clients stay out of the base install: the runtime imports them lazily
# so an offline check needs no network libraries.
dependencies = [
  "numpy>=1.24,<3",
  "PyYAML>=6,<7",
  # Storage read/write type semantics come from pandas inference; the runtime
  # reproduces open-dataflow 1.0.10 behavior by calling the same library rather
  # than reimplementing its coercion rules.
  "pandas>=2.2,<4",
  "requests>=2.31,<3",
  "tqdm>=4.66,<5",
  "colorlog>=6,<7",
]

[project.optional-dependencies]
# ReviewAgent and the embedding-based embedding quality review.
review = ["openai>=1,<3"]
# Coding-agent backends. Only Claude ships a Python package; Codex and OpenCode
# are Node CLIs the runtime shells out to, so they cannot be pip-installed:
#   npm install -g @openai/codex
#   npm install -g opencode-ai
# See docs/getting-started.md.
claude = ["claude-agent-sdk"]
# Parquet entry files and parquet step caches.
parquet = ["pyarrow>=14"]
# Offline test suite for the whole repository, including the method trees.
dev = [
  "pytest>=8.3,<9",
  "pydantic>=2.10,<3",
  "Pillow>=10,<13",
]
# Every Python dependency a real evolution run can need. A coding-agent backend
# still has to be installed separately; see the note above.
all = [
  "datalite-rsi[review,claude,parquet]",
]

[project.scripts]
datalite-rsi = "rsi.framework.cli:main"

[project.urls]
Homepage = "https://github.com/haolpku/DataLite-RSI"
Documentation = "https://github.com/haolpku/DataLite-RSI/tree/main/docs"
Issues = "https://github.com/haolpku/DataLite-RSI/issues"

[tool.setuptools.packages.find]
# Only the active runtime is importable as a package. rsi/methods/ holds
# research source references that the runtime never imports.
include = ["rsi.framework*"]

[tool.setuptools.package-data]
"rsi.framework" = [
  "configs/*.yaml",
  "tasks/*.json",
  "schemas/*.json",
  "method.json",
  "requirements/*.txt",
  "skills/providers/*/*/SKILL.md",
  "skills/providers/*/*/references/*.md",
]

# OPSD Configuration: Qwen3-8B on OpenThought-30k
# LSC ascending low-tail data selection with 6-iteration recursive improvement

method: opsd
version: "1.0"

# Base Model Configuration
base_model:
  name: "Qwen/Qwen3-8B"
  source: "huggingface"
  revision: "base"

# Training Data Configuration
training_data:
  source: "OpenThought-30k"
  context_rule: "first text-distinct reference rollout per question"
  candidate_pool: 6400
  selected_size: 3200
  selection_strategy: "lsc_ascending"
  
# LSC Metric Configuration
lsc_metric:
  name: "Late Support Collapse"
  abbreviation: "LSC"
  description: "J_80 - J_100, the change in top-20 support overlap after revealing the final 20% of reference reasoning"
  model_context_limit: 8192
  response_scoring_tokens: 1024
  top_k: 20
  levels: [80, 100]
  ranking: "ascending"
  selection_fraction: 0.50
  fields:
    level_80_mean_support_overlap: "mean per-token Jaccard(student top-20, privileged 80% top-20)"
    level_100_mean_support_overlap: "mean per-token Jaccard(student top-20, privileged 100% top-20)"
    mean_support_overlap_late_collapse: "level_80_mean_support_overlap - level_100_mean_support_overlap"
  truncation: "crop reasoning prefix only; preserve final answer; record truncated=true"
  
  # Threshold calibration
  calibration:
    method: "validation_rollout"
    validation_split_ratio: null  # supplied run uses the previous iteration AIME26 evaluation
    
  parameters:
    support_distance: "jaccard"
    common_token_window: true
    reference_selection: "fixed before labels are read"

# Iteration Configuration
iterations:
  num_iterations: 6
  
  # Per-iteration workflow
  iteration_workflow:
    - step: "validation_rollout"
      description: "Generate model predictions on validation benchmarks"
      config:
        temperature: 0.6
        n_sampling: 4
        
    - step: "lcs_computation"
      description: "Compute LSC metric for validation examples"
      config:
        scoring: "forced scoring of the same student continuation"
        prompts: "base/student, privileged_80, privileged_100"
        aggregation: "mean over common scored tokens"
      
    - step: "threshold_calibration"
      description: "Freeze LSC ranking protocol based on validation performance"
      config:
        strategy: "use the previous iteration eval to compute the LSC cut, rank the fixed 6400-row pool ascending, select exactly 3200 rows"
        default_fraction: 0.50
        label_usage: "correctness labels are not used to fit the cut; previous-eval LSC is carried into the next iteration"
      
    - step: "bad_case_analysis"
      description: "Analyze validation examples with low accuracy"
      config:
        fields: ["lsc", "rollout_accuracy", "level_80_mean_support_overlap", "level_100_mean_support_overlap"]
        report: ["Spearman", "all_correct_auc", "precision", "recall", "lift"]
      
    - step: "data_selection"
      description: "Select training data using calibrated threshold"
      config:
        selection_size: 3200
        diversity_constraint: "none; preserve fixed rank order"
        
    - step: "training"
      description: "Train model on selected data"
      # Training hyperparameters below

# Training Hyperparameters
training:
  # Optimizer
  optimizer: "adamw"
  learning_rate: null  # set by the training run; not part of the frozen LSC protocol
  weight_decay: null
  
  # Schedule
  lr_scheduler: null
  warmup_ratio: null
  
  # Batch and epochs
  per_device_train_batch_size: null
  gradient_accumulation_steps: null
  num_train_epochs: null
  
  # Precision
  mixed_precision: null
  
  # Other
  seed: 42
  gradient_checkpointing: null

# Validation Benchmarks (In-Loop Feedback)
validation_benchmarks:
  # Optional generic diagnostic datasets; not used in the supplied AIME26 run.
  - name: "gsm8k"
    split: "test"
    subset_ratio: 0.1  # 10% diagnostic subset
    
  - name: "hendrycks-math"
    split: "test"
    subset_ratio: 0.1  # 10% diagnostic subset

# Test Benchmarks (Held-Out Evaluation)
test_benchmarks:
  - name: "gsm8k"
    split: "test"
    subset_ratio: 1.0  # Full test set
    
  - name: "hendrycks-math"
    split: "test"
    subset_ratio: 1.0
    
  - name: "aime24"
    split: "test"
    
  - name: "aime25"
    split: "test"
    
  - name: "aime26"
    split: "test"
    
  - name: "amc23"
    split: "test"
    
  - name: "minerva-math"
    split: "test"
    
  - name: "olympiadbench"
    split: "test"
    
  - name: "gaokao2024-mix"
    split: "test"

# Evaluation Configuration
evaluation:
  harness: "qwen25_math"  # Reuse Qwen2.5-Math evaluation harness
  metrics:
    primary: "avg@4"
    secondary: ["pass@1", "pass@4"]
  generation:
    temperature: 0.6
    n_sampling: 4
    max_tokens: 2048

# Compute Configuration
compute:
  num_gpus: null
  gpu_type: null
  distributed_strategy: null

# Reproducibility
reproducibility:
  seed: 42
  deterministic: true
  environment: "record exact CUDA, PyTorch, Transformers, and vLLM versions with each run"

# Logging and Checkpointing
logging:
  log_level: "INFO"
  log_interval: 10
  eval_interval: "each iteration"
  
checkpointing:
  save_strategy: "epoch"
  save_total_limit: 2
  output_dir: "artifacts/opsd-qwen3-openthought"

# Experiment Tracking
tracking:
  framework: "none"
  project_name: "opsd-qwen3-openthought"
  run_name: "opsd-lsc-qwen3-8b"

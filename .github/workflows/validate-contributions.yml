name: Validate DataLite-RSI contributions

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate manifests
        run: python scripts/validate_contributions.py .

      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run all offline tests
        run: python scripts/run_checks.py

      - name: Check website and README consistency
        run: python scripts/build_site.py --check
